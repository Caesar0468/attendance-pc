<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Construction Site Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">
    <div class="bg-slate-800 rounded-2xl shadow-xl max-w-md w-full p-6 space-y-5 border border-slate-700">
        
        <div class="text-center space-y-1">
            <i class="fa-solid fa-helmet-safety text-amber-500 text-3xl"></i>
            <h2 class="font-bold text-xl">Site Supervisor Portal</h2>
            <p class="text-xs text-slate-400">Kshirsagar Group Mobile Interface</p>
        </div>

        <div class="grid grid-cols-2 gap-2 p-1 bg-slate-900 rounded-xl text-xs font-semibold">
            <button id="tabAttendanceBtn" onclick="switchTab('attendance')" class="py-2.5 rounded-lg bg-amber-500 text-slate-900 transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-camera"></i> Attendance
            </button>
            <button id="tabEnrollBtn" onclick="switchTab('enroll')" class="py-2.5 rounded-lg text-slate-400 hover:text-white transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-user-plus"></i> Enroll Worker
            </button>
        </div>

        <form id="attendanceForm" onsubmit="handleAttendanceUpload(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Supervisor Name</label>
                <input type="text" id="username" required placeholder="Enter your name" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white outline-none focus:border-amber-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Session</label>
                <select id="session" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white outline-none focus:border-amber-500">
                    <option value="morning">Morning</option>
                    <option value="evening">Evening</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Photo Date</label>
                <input type="date" id="photoDate" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white outline-none focus:border-amber-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Capture Group Photo</label>
                <input type="file" id="photoFile" accept="image/*" capture="environment" required class="w-full text-xs text-slate-400 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-amber-500 file:text-slate-900 hover:file:bg-amber-600">
            </div>

            <button type="submit" id="attSubmitBtn" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-2.5 rounded-xl text-sm transition">
                Upload & Process Attendance
            </button>
        </form>

        <form id="enrollForm" onsubmit="handleWorkerEnroll(event)" class="hidden space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Full Worker Name</label>
                <input type="text" id="workerName" required placeholder="e.g., Ramesh Kumar" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white outline-none focus:border-emerald-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Take 2–3 Clear Face Photos</label>
                <input type="file" id="workerPhotos" multiple accept="image/*" capture="user" required class="w-full text-xs text-slate-400 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-emerald-500 file:text-slate-900 hover:file:bg-emerald-600">
                <p class="text-[10px] text-slate-400 mt-1">Select or snap 2 to 3 well-lit front-facing photos of the worker.</p>
            </div>

            <button type="submit" id="enrollSubmitBtn" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-900 font-bold py-2.5 rounded-xl text-sm transition">
                Register New Worker
            </button>
        </form>

        <div id="statusMessage" class="hidden text-center text-xs font-medium p-3 rounded-lg"></div>
    </div>

    <script>
        document.getElementById('photoDate').value = new Date().toISOString().split('T')[0];

        function switchTab(tab) {
            const attForm = document.getElementById('attendanceForm');
            const enrollForm = document.getElementById('enrollForm');
            const attBtn = document.getElementById('tabAttendanceBtn');
            const enrollBtn = document.getElementById('tabEnrollBtn');
            const status = document.getElementById('statusMessage');

            status.className = 'hidden';

            if (tab === 'attendance') {
                attForm.classList.remove('hidden');
                enrollForm.classList.add('hidden');
                attBtn.className = 'py-2.5 rounded-lg bg-amber-500 text-slate-900 transition flex items-center justify-center gap-2';
                enrollBtn.className = 'py-2.5 rounded-lg text-slate-400 hover:text-white transition flex items-center justify-center gap-2';
            } else {
                enrollForm.classList.remove('hidden');
                attForm.classList.add('hidden');
                enrollBtn.className = 'py-2.5 rounded-lg bg-emerald-500 text-slate-900 transition flex items-center justify-center gap-2';
                attBtn.className = 'py-2.5 rounded-lg text-slate-400 hover:text-white transition flex items-center justify-center gap-2';
            }
        }

        async function handleAttendanceUpload(e) {
            e.preventDefault();
            const btn = document.getElementById('attSubmitBtn');
            const status = document.getElementById('statusMessage');
            
            btn.disabled = true;
            btn.textContent = 'Processing faces...';
            status.className = 'hidden';

            const formData = new FormData();
            formData.append('file', document.getElementById('photoFile').files[0]);
            formData.append('username', document.getElementById('username').value);
            formData.append('session', document.getElementById('session').value);
            formData.append('timestamp', new Date().toISOString());
            formData.append('date', document.getElementById('photoDate').value);

            try {
                const res = await fetch('/upload-photo', { method: 'POST', body: formData });
                const data = await res.json();

                if (res.ok) {
                    status.textContent = `Success! Detected ${data.faces_detected} face(s).`;
                    status.className = 'bg-emerald-900/50 text-emerald-300 border border-emerald-700 text-center text-xs font-medium p-3 rounded-lg';
                    document.getElementById('attendanceForm').reset();
                    document.getElementById('photoDate').value = new Date().toISOString().split('T')[0];
                } else {
                    throw new Error(data.detail || 'Upload failed');
                }
            } catch (err) {
                status.textContent = err.message;
                status.className = 'bg-rose-900/50 text-rose-300 border border-rose-700 text-center text-xs font-medium p-3 rounded-lg';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Upload & Process Attendance';
            }
        }

        async function handleWorkerEnroll(e) {
            e.preventDefault();
            const btn = document.getElementById('enrollSubmitBtn');
            const status = document.getElementById('statusMessage');

            btn.disabled = true;
            btn.textContent = 'Extracting face features...';
            status.className = 'hidden';

            const formData = new FormData();
            formData.append('name', document.getElementById('workerName').value);
            const files = document.getElementById('workerPhotos').files;
            
            for (let f of files) {
                formData.append('photos', f);
            }

            try {
                const res = await fetch('/api/workers', { method: 'POST', body: formData });
                const data = await res.json();

                if (res.ok) {
                    status.textContent = `Worker "${data.name}" enrolled successfully!`;
                    status.className = 'bg-emerald-900/50 text-emerald-300 border border-emerald-700 text-center text-xs font-medium p-3 rounded-lg';
                    document.getElementById('enrollForm').reset();
                } else {
                    throw new Error(data.detail || 'Enrollment failed');
                }
            } catch (err) {
                status.textContent = err.message;
                status.className = 'bg-rose-900/50 text-rose-300 border border-rose-700 text-center text-xs font-medium p-3 rounded-lg';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Register New Worker';
            }
        }
    </script>
</body>
</html>
