<script>
    async function handleWorkerEnroll(e) {
        e.preventDefault();
        const btn = document.getElementById('enrollBtn');
        btn.disabled = true;
        btn.textContent = 'Processing...';

        const formData = new FormData();
        formData.append('name', document.getElementById('workerName').value);
        const files = document.getElementById('workerPhotos').files;
        for (let f of files) formData.append('photos', f);

        try {
            const res = await fetch('/api/workers', { method: 'POST', body: formData });
            const text = await res.text();
            let data = {};
            try { data = JSON.parse(text); } catch (_) {}

            if (res.ok) {
                document.getElementById('enrollForm').reset();
                loadWorkers();
            } else {
                alert(data.detail || text || 'Failed to enroll worker');
            }
        } catch (err) {
            alert(err.message || 'Error communicating with server');
        } finally {
            btn.disabled = false;
            btn.textContent = 'Enroll Worker';
        }
    }
</script>
